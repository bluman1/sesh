name: Release

# Triggered when you push a tag matching v* (e.g. `git tag v0.0.2 && git push --tags`).
#
# Currently a BUILD-ONLY workflow: each runner produces a platform-specific
# .vsix (so better-sqlite3's native binary matches the user's OS), and they're
# all attached to a GitHub Release with auto-generated notes. Marketplace
# upload is manual — open the publisher dashboard and drop each .vsix in.
# (The Azure DevOps PAT path that vsce auto-publish needs is currently
# blocked on the Microsoft account side. To re-enable auto-publish later:
# add a publish job that runs `vsce publish --packagePath` per .vsix with
# VSCE_PAT in repo secrets — see git history for commit 1f5d028.)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # needed to create the GitHub Release

jobs:
  package:
    name: Package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-13
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npx vitest run

      - name: Build extension + webview
        run: npm run build

      - name: Package .vsix for ${{ matrix.target }}
        run: npx --yes @vscode/vsce package --target ${{ matrix.target }} -o sesh-${{ matrix.target }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: sesh-${{ matrix.target }}.vsix
          if-no-files-found: error

  release:
    name: Attach .vsix files to GitHub Release
    needs: package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the GH release notes can diff against the previous tag

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: vsix-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la dist/

      - name: Create GitHub Release with .vsix files attached
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Manual marketplace upload

            Auto-publish to the Marketplace is currently disabled. Download each
            `.vsix` below and upload it at:

            https://marketplace.visualstudio.com/manage/publishers/MichaelOgundare

            (Click ⋯ on the Sesh entry → **Upload extension**, then drop in each
            platform's .vsix. The Marketplace accepts multiple platform-specific
            uploads under the same version and serves the right one per user.)
